name: Trigger auto deployment for bananay-distribution

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/bananay-distribution-AutoDeployTrigger-4acdb5e6-5c7d-4577-8f61-5cd1dac07711.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.BANANAYDISTRIBUTION_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BANANAYDISTRIBUTION_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BANANAYDISTRIBUTION_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: bananayregistry-dxbhdveghzcwh5fw.azurecr.io
          registryUsername: ${{ secrets.BANANAYDISTRIBUTION_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.BANANAYDISTRIBUTION_REGISTRY_PASSWORD }}
          containerAppName: bananay-distribution
          resourceGroup: Bananay
          imageToBuild: bananayregistry-dxbhdveghzcwh5fw.azurecr.io/bananay-distribution:${{ github.sha }}
          buildArguments: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_COURIER_URL=${{ vars.NEXT_PUBLIC_APP_COURIER_URL }}
            NEXT_PUBLIC_APP_HUB_URL=${{ vars.NEXT_PUBLIC_APP_HUB_URL }}
            NEXT_PUBLIC_APP_PRODUCER_URL=${{ vars.NEXT_PUBLIC_APP_PRODUCER_URL }}
            NEXT_PUBLIC_APP_TRACKING_URL=${{ vars.NEXT_PUBLIC_APP_TRACKING_URL }}
            NEXT_PUBLIC_APP_TRUCK_URL=${{ vars.NEXT_PUBLIC_APP_TRUCK_URL }}

